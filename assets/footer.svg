<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120" role="img" aria-label="End of sheet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>End of sheet</title>
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0" stop-color="#1c5bc0"/><stop offset="1" stop-color="#0b2d70"/></radialGradient>
  <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity=".08"/></pattern>
  <clipPath id="c"><rect width="900" height="120" rx="14"/></clipPath>
</defs>
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .line { stroke: #dbe9ff; fill: none; }
  .draw { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.6s ease-out forwards; }
  .fade { opacity: 0; animation: fade .8s ease-out .8s forwards; }
  .blink { animation: blink 1.4s steps(1) 2s infinite; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .15; } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; fill-opacity: 1 !important; }
}
</style>
<g clip-path="url(#c)"><rect width="900" height="120" fill="url(#bg)"/><rect width="900" height="120" fill="url(#minor)"/></g>
<rect class="line draw" pathLength="100" x="12" y="12" width="876" height="96" rx="5" stroke-width="1.6"/>
<g class="fade">
  <text x="450" y="54" font-size="15" letter-spacing="8" fill="#fff" text-anchor="middle">END OF SHEET</text>
  <text x="450" y="80" font-size="11" letter-spacing="3" fill="#9fc0f5" text-anchor="middle">ANTHALIA PHAM · REV 01 · VIETNAM</text>
  <circle class="blink" cx="326" cy="50" r="3" fill="#7fe0a0"/>
</g>
</svg>

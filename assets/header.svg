<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Anthalia Pham · Business Analyst" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Anthalia Pham</title>
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="75%">
    <stop offset="0" stop-color="#1c5bc0"/>
    <stop offset="1" stop-color="#0b2d70"/>
  </radialGradient>
  <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="1"/>
  </pattern>
  <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
    <path d="M100 0H0V100" fill="none" stroke="#fff" stroke-opacity=".17" stroke-width="1"/>
  </pattern>
  <clipPath id="typeclip"><rect x="56" y="222" width="0" height="24"><animate attributeName="width" from="0" to="330" dur="1.8s" begin="3.2s" fill="freeze"/></rect></clipPath>
  <clipPath id="card"><rect x="0" y="0" width="900" height="340" rx="14"/></clipPath>
</defs>
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .ink { fill: #eaf2ff; }
  .dim { fill: #9fc0f5; }
  .line { stroke: #dbe9ff; fill: none; }
  .draw { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.8s ease-out forwards; }
  .name { font-size: 62px; font-weight: 700; letter-spacing: 4px; fill: #fff; fill-opacity: 0; stroke: #fff; stroke-width: 1.3;
          stroke-dasharray: 1200; stroke-dashoffset: 1200;
          animation: nameDraw 2.2s ease-out .5s forwards, nameFill .9s ease-out 2.5s forwards; }
  .fade { opacity: 0; animation: fade .7s ease-out forwards; }
  .grow { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: gx 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
  .cursor { fill: #fff; opacity: 0; animation: blink 1s steps(1) 5s infinite; }
  .sweep { fill: #fff; opacity: 0; animation: sweep 7s ease-in-out 5.5s infinite; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes nameDraw { to { stroke-dashoffset: 0; } }
  @keyframes nameFill { to { fill-opacity: 1; stroke-width: 0; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes gx { to { transform: scaleX(1); } }
  @keyframes blink { 0%,100% { opacity: .95; } 50% { opacity: 0; } }
  @keyframes sweep { 0% { opacity: 0; transform: translateX(0); } 10% { opacity: .22; } 90% { opacity: .22; } 100% { opacity: 0; transform: translateX(840px); } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; transform: none !important;
      stroke-dashoffset: 0 !important; fill-opacity: 1 !important; }
}
</style>

<g clip-path="url(#card)">
  <rect width="900" height="340" fill="url(#bg)"/>
  <rect width="900" height="340" fill="url(#minor)"/>
  <rect width="900" height="340" fill="url(#major)"/>
  <rect class="sweep" x="30" y="22" width="2" height="296"/>
</g>

<rect class="line draw" pathLength="100" x="14" y="14" width="872" height="312" rx="6" stroke-width="1.8"/>
<rect class="line draw" pathLength="100" x="22" y="22" width="856" height="296" rx="3" stroke-width="1" stroke-opacity=".45" style="animation-delay:.3s"/>

<g class="fade" style="animation-delay:.9s">
  <text class="dim" x="44" y="52" font-size="12" letter-spacing="3">SHEET 01 / PROFILE</text>
  <text class="dim" x="856" y="52" font-size="12" letter-spacing="3" text-anchor="end">REV 01</text>
</g>

<text class="name" x="56" y="162">ANTHALIA PHAM</text>

<g class="fade" style="animation-delay:2.4s">
  <path class="line" stroke-width="1.2" d="M56 178V206M622 178V206"/>
  <path class="line" stroke-width="1.2" d="M56 192H241M437 192H622"/>
  <path fill="#dbe9ff" d="M56 192l9-4v8zM622 192l-9-4v8z"/>
  <text class="ink" x="339" y="197" font-size="13" letter-spacing="3" text-anchor="middle">BUSINESS ANALYST</text>
</g>

<g clip-path="url(#typeclip)">
  <text class="ink" x="56" y="240" font-size="18">&gt; Hello World! I'm Anthalia</text>
</g>
<rect class="cursor" x="392" y="224" width="9" height="19"/>

<g class="fade" style="animation-delay:3.4s">
  <circle cx="634" cy="136" r="4" fill="none" stroke="#dbe9ff" stroke-width="1.4"/>
  <path class="line" stroke-width="1.2" d="M638 132L676 92H860"/>
  <text class="dim" x="684" y="84" font-size="11" letter-spacing="3">NOTE 1</text>
  <text class="ink" x="684" y="112" font-size="12" letter-spacing="1.5">SHUT UP AND PRACTICE</text>
</g>

<g class="fade" style="animation-delay:3.8s">
  <rect class="line" x="580" y="256" width="276" height="54" stroke-width="1.4"/>
  <path class="line" stroke-width="1" d="M580 283H856M690 256V310"/>
  <text class="dim" x="588" y="270" font-size="9" letter-spacing="2">DRAWN BY</text>
  <text class="ink" x="588" y="299" font-size="11" letter-spacing="0">ANTHALIA PHAM</text>
  <text class="dim" x="698" y="270" font-size="9" letter-spacing="2">TITLE</text>
  <text class="ink" x="698" y="299" font-size="12" letter-spacing="1">GITHUB PROFILE</text>
</g>
</svg>
